<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solución Matriz 3x4 - Gauss Jordan_Jaure_rev_correcto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
   .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
        }
   .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
   .sistema {
            margin-bottom: 25px;
        }
   .fila {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 1fr 30px 1fr;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
   .fila-label {
            font-weight: bold;
            color: #667eea;
            text-align: center;
            font-size: 18px;
        }
   .fila input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            width: 100%;
        }
   .fila input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
   .igual {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }
   .headers {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 1fr 30px 1fr;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }
   .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
   .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
   .btn-clear {
            background: #6c757d;
        }
   .btn-clear:hover {
            background: #5a6268;
        }
   .paso {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
   .paso h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
   .matrix-display {
            display: inline-block;
            border: 2px solid #333;
            border-left: none;
            border-right: none;
            padding: 10px 20px;
            margin: 10px 0;
        }
   .matrix-row {
            display: flex;
            gap: 15px;
            margin: 8px 0;
            justify-content: center;
        }
   .matrix-cell {
            min-width: 70px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
   .operacion {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
   .solucion {
            background: #d4edda;
            border: 2px solid #28a745;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
   .solucion h3 {
            color: #155724;
            margin-bottom: 15px;
        }
   .solucion-item {
            font-size: 18px;
            margin: 8px 0;
            font-weight: bold;
        }
   .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 2px solid #dc3545;
        }
   .fraction {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
        }
   .fraction > span {
            display: block;
            padding: 0 2px;
        }
   .fraction.top {
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resolución de Sistema 3x4_REV_JAURE_CORRECTO</h1>
        <p class="subtitle">Método de Gauss-Jordan paso a paso con R1, R2, R3</p>

        <div class="sistema">
            <div class="headers">
                <div></div>
                <div>a</div>
                <div>b</div>
                <div>c</div>
                <div></div>
                <div>resultado</div>
            </div>

            <div class="fila">
                <div class="fila-label">R1</div>
                <input type="number" step="any" id="a11" placeholder="0">
                <input type="number" step="any" id="a12" placeholder="0">
                <input type="number" step="any" id="a13" placeholder="0">
                <div class="igual">=</div>
                <input type="number" step="any" id="b1" placeholder="0">
            </div>

            <div class="fila">
                <div class="fila-label">R2</div>
                <input type="number" step="any" id="a21" placeholder="0">
                <input type="number" step="any" id="a22" placeholder="0">
                <input type="number" step="any" id="a23" placeholder="0">
                <div class="igual">=</div>
                <input type="number" step="any" id="b2" placeholder="0">
            </div>

            <div class="fila">
                <div class="fila-label">R3</div>
                <input type="number" step="any" id="a31" placeholder="0">
                <input type="number" step="any" id="a32" placeholder="0">
                <input type="number" step="any" id="a33" placeholder="0">
                <div class="igual">=</div>
                <input type="number" step="any" id="b3" placeholder="0">
            </div>
        </div>

        <button class="btn" onclick="resolver()">Resolver Sistema</button>
        <button class="btn btn-clear" onclick="limpiar()">Limpiar Todo</button>

        <div id="resultado"></div>
    </div>

    <script>
        function mcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        function decimalAFraccion(decimal, tolerancia = 0.000001) {
            if (Math.abs(decimal) < tolerancia) return "0";
            if (Number.isInteger(decimal)) return decimal.toString();

            let signo = decimal < 0? "-" : "";
            decimal = Math.abs(decimal);

            for (let den = 1; den <= 1000; den++) {
                let num = Math.round(decimal * den);
                if (Math.abs(decimal - num / den) < tolerancia) {
                    let divisor = mcd(num, den);
                    num = num / divisor;
                    den = den / divisor;
                    if (den === 1) return signo + num;
                    return `${signo}<div class="fraction"><span class="top">${num}</span><span>${den}</span></div>`;
                }
            }
            return signo + decimal.toFixed(4).replace(/\.?0+$/, "");
        }

        function mostrarMatriz(matriz, titulo) {
            let html = `<div class="paso"><h3>${titulo}</h3><div class="matrix-display">`;
            for (let i = 0; i < 3; i++) {
                html += '<div class="matrix-row">';
                for (let j = 0; j < 4; j++) {
                    html += `<div class="matrix-cell">${decimalAFraccion(matriz[i][j])}</div>`;
                }
                html += '</div>';
            }
            html += '</div></div>';
            return html;
        }

        function resolver() {
            const m = [
                [parseFloat(document.getElementById('a11').value) || 0,
                 parseFloat(document.getElementById('a12').value) || 0,
                 parseFloat(document.getElementById('a13').value) || 0,
                 parseFloat(document.getElementById('b1').value) || 0],
                [parseFloat(document.getElementById('a21').value) || 0,
                 parseFloat(document.getElementById('a22').value) || 0,
                 parseFloat(document.getElementById('a23').value) || 0,
                 parseFloat(document.getElementById('b2').value) || 0],
                [parseFloat(document.getElementById('a31').value) || 0,
                 parseFloat(document.getElementById('a32').value) || 0,
                 parseFloat(document.getElementById('a33').value) || 0,
                 parseFloat(document.getElementById('b3').value) || 0]
            ];

            let resultado = document.getElementById('resultado');
            resultado.innerHTML = mostrarMatriz(m, 'Matriz Inicial');

            let matriz = m.map(row => [...row]);
            let pasos = 1;

            try {
                for (let i = 0; i < 3; i++) {
                    // Buscar pivote
                    if (Math.abs(matriz[i][i]) < 0.000001) {
                        let intercambio = false;
                        for (let k = i + 1; k < 3; k++) {
                            if (Math.abs(matriz[k][i]) > 0.000001) {
                                [matriz[i], matriz[k]] = [matriz[k], matriz[i]];
                                resultado.innerHTML += `<div class="operacion">Intercambiar R${i+1} ↔️ R${k+1}</div>`;
                                resultado.innerHTML += mostrarMatriz(matriz, `Paso ${pasos++}: Intercambio`);
                                intercambio = true;
                                break;
                            }
                        }
                        if (!intercambio) {
                            // Verificar si es inconsistente o infinitas soluciones
                            if (Math.abs(matriz[i][3]) > 0.000001) {
                                throw new Error("Sistema inconsistente. No tiene solución porque se llega a 0 = " + decimalAFraccion(matriz[i][3]));
                            } else {
                                throw new Error("Sistema con infinitas soluciones. La fila " + (i+1) + " se hizo cero.");
                            }
                        }
                    }

                    // Hacer 1 el pivote
                    if (Math.abs(matriz[i][i] - 1) > 0.000001) {
                        let factor = matriz[i][i];
                        for (let j = 0; j < 4; j++) matriz[i][j] /= factor;
                        resultado.innerHTML += `<div class="operacion">R${i+1} → R${i+1} / ${decimalAFraccion(factor)}</div>`;
                        resultado.innerHTML += mostrarMatriz(matriz, `Paso ${pasos++}: Pivote R${i+1} = 1`);
                    }

                    // Hacer ceros en la columna
                    for (let k = 0; k < 3; k++) {
                        if (k!== i && Math.abs(matriz[k][i]) > 0.000001) {
                            let factor = matriz[k][i];
                            for (let j = 0; j < 4; j++) matriz[k][j] -= factor * matriz[i][j];
                            resultado.innerHTML += `<div class="operacion">R${k+1} → R${k+1} - (${decimalAFraccion(factor)})*R${i+1}</div>`;
                        }
                    }
                    resultado.innerHTML += mostrarMatriz(matriz, `Paso ${pasos++}: Ceros en columna ${i+1}`);
                }

                // Verificar si hay fila 0 = número
                for (let i = 0; i < 3; i++) {
                    let filaEsCero = true;
                    for (let j = 0; j < 3; j++) {
                        if (Math.abs(matriz[i][j]) > 0.000001) {
                            filaEsCero = false;
                            break;
                        }
                    }
                    if (filaEsCero && Math.abs(matriz[i][3]) > 0.000001) {
                        throw new Error("Sistema inconsistente. No tiene solución.");
                    }
                }

                let solHtml = `<div class="solucion"><h3>Solución del Sistema:</h3>`;
                solHtml += `<div class="solucion-item">a = ${decimalAFraccion(matriz[0][3])}</div>`;
                solHtml += `<div class="solucion-item">b = ${decimalAFraccion(matriz[1][3])}</div>`;
                solHtml += `<div class="solucion-item">c = ${decimalAFraccion(matriz[2][3])}</div>`;
                solHtml += `</div>`;
                resultado.innerHTML += solHtml;

            } catch (error) {
                resultado.innerHTML += `<div class="error"><strong>Error:</strong> ${error.message}</div>`;
            }

            // Scroll automático al resultado
            resultado.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function limpiar() {
            document.querySelectorAll('input').forEach(input => input.value = '');
            document.getElementById('resultado').innerHTML = '';
        }

        window.onload = () => {
            document.getElementById('a11').value = 2;
            document.getElementById('a12').value = 1;
            document.getElementById('a13').value = -1;
            document.getElementById('b1').value = 8;
            document.getElementById('a21').value = -3;
            document.getElementById('a22').value = -1;
            document.getElementById('a23').value = 2;
            document.getElementById('b2').value = -11;
            document.getElementById('a31').value = -2;
            document.getElementById('a32').value = 1;
            document.getElementById('a33').value = 2;
            document.getElementById('b3').value = -3;
        };
    </script>
</body>
</html>
